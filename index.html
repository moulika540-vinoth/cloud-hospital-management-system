
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🏥 MediCare Hospital</h1>
        <p>Cloud Hospital Management Dashboard</p>
    </header>

    <main>
        <section class="dashboard">
            <div class="stat-card">
                <h3>Total Patients</h3>
                <p id="totalPatients">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Doctors</h3>
                <p id="totalDoctors">4</p>
            </div>

            <div class="stat-card">
                <h3>Appointments</h3>
                <p id="totalAppointments">0</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Register New Patient</h2>

            <form id="patientForm">
                <input type="text" id="patientName" placeholder="Patient Name" required>
                <input type="number" id="patientAge" placeholder="Age" min="1" max="120" required>

                <select id="patientGender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>

                <input type="text" id="patientPhone" placeholder="Phone Number" required>

                <button type="submit">Register Patient</button>
            </form>
        </section>

        <section class="form-section">
            <h2>Book Appointment</h2>

            <form id="appointmentForm">
                <select id="appointmentPatient" required>
                    <option value="">Select Patient</option>
                </select>

                <select id="appointmentDoctor" required>
                    <option value="">Select Doctor</option>
                    <option>Dr. Arun - Cardiologist</option>
                    <option>Dr. Priya - Dentist</option>
                    <option>Dr. Kumar - Neurologist</option>
                    <option>Dr. Meena - General Physician</option>
                </select>

                <input type="date" id="appointmentDate" required>

                <button type="submit">Book Appointment</button>
            </form>
        </section>

        <section class="table-section">
            <h2>Patient Records</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="patientTable"></tbody>
            </table>
        </section>

        <section class="table-section">
            <h2>Appointment Records</h2>

            <table>
                <thead>
                    <tr>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="appointmentTable"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>MediCare Hospital Management System | Project 4</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
